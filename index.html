<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>KinStudy - AI Olympiad & Document Engine</title>
  <link rel="stylesheet" href="style.css" />

  <!-- PDF.js Engine for Document Processing -->
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>

  <!-- Transformers.js v3 for WebGPU SmolVLM-2.2B Execution -->
  <script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.3.0';
    env.allowLocalModels = false;
    window.HFPipeline = pipeline;
  </script>
</head>
<body>
  <div id="app">
    <!-- Top Navigation Bar -->
    <header class="top-nav">
      <div class="brand">
        <span class="logo-icon">📚</span>
        <span class="logo-title">KinStudy</span>
      </div>

      <div class="nav-controls">
        <div class="toggle-group">
          <button id="mode-online-btn" class="toggle-pill active">⚡ Online</button>
          <button id="mode-offline-btn" class="toggle-pill">📴 Offline</button>
        </div>
        <div id="engine-status-badge" class="status-pill ready">Ready</div>
      </div>
    </header>

    <!-- Chat Messages Stream Area -->
    <main id="chat-scroller" class="chat-container">
      <div id="messages-list" class="messages-list">
        <div class="message-row assistant">
          <div class="msg-bubble">
            <p>Ready. Snap an Olympiad diagram, drop a textbook PDF, or upload code/text notes to begin.</p>
          </div>
        </div>
      </div>
    </main>

    <!-- Bottom Input Area -->
    <footer class="input-dock">
      <!-- Staged Upload Pill (Shown when file is chosen) -->
      <div id="staged-attachment-bar" class="staged-bar hidden">
        <div class="staged-pill">
          <img id="staged-thumb" class="staged-thumb" alt="Thumbnail" />
          <div class="staged-meta">
            <span id="staged-filename" class="staged-filename">file.png</span>
            <span id="staged-filesize" class="staged-filesize">0 KB</span>
          </div>
          <button id="staged-remove-btn" class="staged-remove" title="Remove attachment">✕</button>
        </div>
      </div>

      <!-- Action Controls & Textarea -->
      <div class="input-row">
        <div class="dock-actions">
          <label for="file-upload-input" class="dock-btn" title="Attach file or photo">
            📎
          </label>
          <!-- Multi-format upload support -->
          <input 
            type="file" 
            id="file-upload-input" 
            accept="image/*,application/pdf,.txt,.md,.py,.js,.html,.css,.json,.csv" 
            style="display: none;" 
          />

          <!-- Manual Resolution Dropdown -->
          <select id="resolution-select" class="resolution-dropdown" title="Select Image Processing Quality">
            <option value="480p">⚡ 480p</option>
            <option value="720p" selected>🎯 720p</option>
            <option value="1080p">🔍 1080p</option>
          </select>
        </div>

        <textarea
          id="chat-textarea"
          rows="1"
          placeholder="Ask a question, analyze a diagram, or solve Olympiad homework..."
        ></textarea>

        <button id="send-btn" class="send-btn" title="Send">
          ➔
        </button>
      </div>
    </footer>
  </div>

  <!-- Tap-to-View Fullscreen Preview Modal -->
  <div id="file-preview-modal" class="modal-overlay hidden" onclick="window.closeModal()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <span id="modal-file-title" class="modal-title">file_preview</span>
        <button class="modal-close" onclick="window.closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modal-file-body"></div>
      <div class="modal-footer" id="modal-file-meta"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
